# Test configuration for Payment Service
spring:
  application:
    name: payment-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Disable Eureka for tests
eureka:
  client:
    enabled: false

# Test decline card
payment:
  test:
    decline-card: "4000000000000002"

# Logging
logging:
  level:
    com.restaurant.payment: DEBUG
