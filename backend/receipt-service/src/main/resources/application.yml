server:
  port: 8086

spring:
  application:
    name: receipt-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/receipt_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:restaurant}
    password: ${MYSQL_PASSWORD:RestaurantDev2025!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      initialization-fail-timeout: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: receipt-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "com.restaurant.order.kafka.OrderEvent:com.restaurant.receipt.kafka.OrderEvent"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.restaurant.receipt.kafka.OrderEvent

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5

# Restaurant configuration for receipts
restaurant:
  name: ${RESTAURANT_NAME:Restaurant App}
  address: ${RESTAURANT_ADDRESS:Musterstrasse 1, 8000 Zürich}
  phone: ${RESTAURANT_PHONE:+41 44 123 45 67}
  vat-number: ${RESTAURANT_VAT:CHE-123.456.789}
  vat-rate: ${RESTAURANT_VAT_RATE:7.7}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.restaurant.receipt: DEBUG
