server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: prod
  cloud:
    gateway:
      # Global CORS Configuration - PRODUCTION (HTTPS only)
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "https://${DOMAIN:restaurant.example.com}"
              - "https://www.${DOMAIN:restaurant.example.com}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - X-Session-ID
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # All routes same as development...
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**

        - id: category-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/categories/**

        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/cart/**

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: customer-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/customers/**

        - id: settings-service
          uri: lb://SETTINGS-SERVICE
          predicates:
            - Path=/api/settings/**

        - id: receipts-service
          uri: lb://RECEIPT-SERVICE
          predicates:
            - Path=/api/receipts/**

        - id: receipt-templates-service
          uri: lb://SETTINGS-SERVICE
          predicates:
            - Path=/api/receipt-templates/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka-server}:${EUREKA_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: WARN
    reactor.netty: WARN
