name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # Backend - Build & Test
  # ============================================================================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      matrix:
        service:
          [
            eureka-server,
            api-gateway,
            product-service,
            cart-service,
            order-service,
            payment-service,
            auth-service,
          ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Build ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean compile -DskipTests
          else
            mvn clean compile -DskipTests
          fi

      - name: Run tests for ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: |
          if [ -f "mvnw" ]; then
            ./mvnw test
          else
            mvn test
          fi

      - name: Collect backend test results
        working-directory: backend/${{ matrix.service }}
        run: |
          mkdir -p ../../test-metrics/backend-${{ matrix.service }}
          cp -v target/surefire-reports/*.xml ../../test-metrics/backend-${{ matrix.service }}/ || true

      - name: Package ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: |
          if [ -f "mvnw" ]; then
            ./mvnw package -DskipTests
          else
            mvn package -DskipTests
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: backend/${{ matrix.service }}/target/*.jar
          retention-days: 7

      - name: Upload backend test metrics
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics-backend-${{ matrix.service }}
          path: test-metrics/backend-${{ matrix.service }}
          retention-days: 7

  # ============================================================================
  # Website - Build & Test
  # ============================================================================
  website-build:
    name: Website Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Lint
        working-directory: website
        run: npm run lint || true

      - name: Type check
        working-directory: website
        run: npm run type-check || true

      - name: Build
        working-directory: website
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  # ============================================================================
  # Client (Tauri) - Build
  # ============================================================================
  client-build:
    name: Client Build (Tauri)
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client

  # ============================================================================
  # Docker Images - Build & Push
  # ============================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-build]
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          [
            eureka-server,
            api-gateway,
            product-service,
            cart-service,
            order-service,
            payment-service,
            auth-service,
          ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: backend/${{ matrix.service }}/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # E2E Tests (Cypress)
  # ============================================================================
  e2e-tests:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: [backend-build]

    env:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant123
      REDIS_PASSWORD: ""
      JWT_SECRET: "xK8pN2mQ5vR9tY3wZ6aD0gH4jL7oS1uF8bE2cI5nM8pQ3rT6wY9zA2dG5hJ8kN1qV4xB7yC0" # test-only secret for CI

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: restaurant_db
          MYSQL_USER: restaurant
          MYSQL_PASSWORD: restaurant123
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          -v ${{ github.workspace }}/.github/initdb:/docker-entrypoint-initdb.d

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Start Backend Services (all) with health checks
        run: |
          set -euo pipefail
          cd backend

          services=(
            eureka-server
            api-gateway
            auth-service
            product-service
            cart-service
            order-service
            payment-service
          )

          health=(
            ""                                        # eureka-server (no health check)
            "http://localhost:8080/actuator/health"   # api-gateway
            "http://localhost:8081/actuator/health"   # auth-service
            "http://localhost:8082/actuator/health"   # product-service
            "http://localhost:8083/actuator/health"   # cart-service
            "http://localhost:8084/actuator/health"   # order-service
            "http://localhost:8085/actuator/health"   # payment-service
          )

          echo "Starting all backend services in background..."
          for svc in "${services[@]}"; do
            echo "Starting $svc ..."
            (cd "$svc" && chmod +x mvnw && ./mvnw spring-boot:run >/tmp/${svc}.log 2>&1 &)
          done

          echo "Waiting for health endpoints..."
          for i in "${!services[@]}"; do
            svc="${services[$i]}"
            url="${health[$i]}"
            if [ -z "$url" ]; then
              echo "Skipping health check for $svc"
              continue
            fi
            echo "Waiting for $svc at $url"
            ok=0
            for attempt in {1..36}; do
              if curl -sf "$url" >/dev/null; then
                echo "$svc is healthy (attempt $attempt)"
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check failed for $svc after 180s"
              echo "Recent log tail for $svc:"
              tail -n 100 "/tmp/${svc}.log" || true
              exit 1
            fi
          done

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Start Frontend
        working-directory: client
        run: |
          npm run dev &
          sleep 10

      - name: Prepare Cypress results dir
        working-directory: client
        run: mkdir -p cypress/results

      - name: Run Cypress Auth Tests
        working-directory: client
        run: npx cypress run --spec "cypress/e2e/auth.cy.ts" --headless --reporter json --reporter-options "output=./cypress/results/auth.json"
        continue-on-error: true

      - name: Run Cypress Security Tests
        working-directory: client
        run: npx cypress run --spec "cypress/e2e/security.cy.ts" --headless --reporter json --reporter-options "output=./cypress/results/security.json"
        continue-on-error: true

      - name: Run Cypress E2E Tests
        working-directory: client
        run: npx cypress run --spec "cypress/e2e/real-e2e/**/*.cy.ts" --headless --reporter json --reporter-options "output=./cypress/results/real-e2e.json"
        continue-on-error: true

      - name: Upload Cypress test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics-e2e
          path: client/cypress/results
          retention-days: 7

      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: client/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: client/cypress/videos
          retention-days: 7

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-build]

    env:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant123
      REDIS_PASSWORD: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Start infrastructure
        run: docker compose up -d mysql redis kafka zookeeper

      - name: Wait for services
        run: |
          echo "Waiting for MySQL..."
          timeout 90 bash -c 'until docker compose exec -T mysql mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD 2>/dev/null; do sleep 3; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until docker compose exec -T redis redis-cli ping 2>/dev/null; do sleep 2; done'
          echo "Services ready!"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Run integration tests
        run: |
          echo "Integration tests would run here"
          # Add actual integration test commands

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ============================================================================
  # Deploy (Example for Cloud Run)
  # ============================================================================
  deploy:
    name: Deploy to Cloud
    runs-on: ubuntu-latest
    needs: [docker-build, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deployment would happen here"
          echo "Services to deploy:"
          echo "  - eureka-server"
          echo "  - api-gateway"
          echo "  - product-service"
          echo "  - cart-service"
          echo "  - order-service"
          echo "  - payment-service"
          echo "  - auth-service"
          # Add actual deployment commands (kubectl, gcloud, etc.)

  # ============================================================================
  # CI Summary
  # ============================================================================
  ci-summary:
    name: CI Summary
    needs:
      [
        backend-build,
        website-build,
        client-build,
        docker-build,
        e2e-tests,
        integration-tests,
        deploy,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download test metrics artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: test-metrics-*
          path: test-metrics
          merge-multiple: true

      - name: Aggregate test results
        if: always()
        run: |
          set -euo pipefail
          python .github/scripts/aggregate_test_metrics.py
